# MKS Gen L v1.0 + DRV8825 1/32. 부품, 검증 필요 값은 @hardware/mks-gen-l/NOTES.md

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1500
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 32
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_min: 0
position_max: 330
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 32
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 32
rotation_distance: 2
endstop_pin: ^PD2
# Z 영점 보정 시 position_endstop, position_max 함께 수정
position_endstop: 260
position_min: -2
position_max: 260
homing_speed: 10

# Z 오른쪽. E0 단자
[stepper_z1]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 32
rotation_distance: 2

# 피스톤. E1 단자. 히터 단자는 비워 둠
[extruder]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 32
rotation_distance: 8
nozzle_diameter: 2.5
filament_diameter: 26.7
max_extrude_only_distance: 100
pressure_advance: 0
heater_pin: PB4
sensor_type: Generic 3950
sensor_pin: PK5
control: watermark
min_temp: -20
max_temp: 40
min_extrude_temp: -20

[controller_fan box]
pin: PH6

# 피스톤 로드가 스스로 잠기지 않아 모터를 켜 둠
[idle_timeout]
timeout: 1800

# Z를 위 스위치로 먼저 올려 판, 케이크와 충돌 방지
[homing_override]
axes: xyz
gcode:
  {% set all = "X" not in params and "Y" not in params and "Z" not in params %}
  {% if all or "Z" in params %}
    G28 Z
  {% endif %}
  {% if all or "X" in params %}
    G28 X
  {% endif %}
  {% if all or "Y" in params %}
    G28 Y
  {% endif %}

[force_move]
enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[respond]

[include cream_vars.cfg]
[include ../../klipper/macros/cream.cfg]

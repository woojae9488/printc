# 크림 매크로. 값은 _CREAM_CFG(`@hardware/active/cream_vars.cfg`)에서만 읽음.
# 피스톤 위치 = 툴헤드 E - piston_zero. 표시선 = 0, 아래로 +.
# 밀대 이동은 M221 S100으로 Extrusion factor를 빼고 RESTORE_GCODE_STATE로 복원.

[gcode_macro _CREAM_STATE]
variable_piston_zero: 0
variable_load_pending: False
gcode:

[gcode_macro _CREAM_CHECK_HOMED]
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_raise_error("크림: 원점 아님. G28 먼저 실행")}
  {% endif %}

# 밀대가 DIST 만큼 움직인 뒤 0–piston_max 안인지 검사
[gcode_macro _CREAM_CHECK_PISTON]
gcode:
  {% set cfg = printer["gcode_macro _CREAM_CFG"] %}
  {% set piston = printer.toolhead.position.e - printer["gcode_macro _CREAM_STATE"].piston_zero %}
  {% set to = piston + params.DIST|float %}
  {% if to < 0 or to > cfg.piston_max %}
    {action_raise_error(
      "크림: 밀대 범위 밖(현재 %.2f, 이동 후 %.2f, 범위 0–%.2f mm). FORCE=1 사용"
      % (piston, to, cfg.piston_max))}
  {% endif %}

[gcode_macro _CREAM_SWAP]
gcode:
  {% set cfg = printer["gcode_macro _CREAM_CFG"] %}
  {% set state = printer["gcode_macro _CREAM_STATE"] %}
  {% set tool = params.TOOL|int %}
  {% if tool < 0 or tool >= cfg.tool_count %}
    {action_raise_error("크림: 없는 카트리지 T%d" % tool)}
  {% endif %}
  {% set to_mark = state.piston_zero - printer.toolhead.position.e %}
  {% set z_top = printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z %}
  {% set z_safe = [[printer.gcode_move.gcode_position.z + cfg.swap_lift, cfg.swap_z]|max, z_top]|min %}
  _CREAM_CHECK_HOMED
  SAVE_GCODE_STATE NAME=_cream_swap
  G90
  M83
  M221 S100
  # 크림이 새지 않게 이동 전 밀대를 표시선으로 올림
  G1 E{to_mark} F{cfg.piston_speed * 60}
  G1 Z{z_safe} F{cfg.travel_speed * 60}
  G1 X{cfg.swap_x} Y{cfg.swap_y} F{cfg.travel_speed * 60}
  RESTORE_GCODE_STATE NAME=_cream_swap
  SET_GCODE_VARIABLE MACRO=_CREAM_STATE VARIABLE=load_pending VALUE=True
  RESPOND MSG="크림: T{tool} 카트리지 교체 후 RESUME"
  PAUSE

[gcode_macro T0]
description: T0 카트리지 교체
gcode:
  _CREAM_SWAP TOOL=0

[gcode_macro T1]
description: T1 카트리지 교체
gcode:
  _CREAM_SWAP TOOL=1

[gcode_macro T2]
description: T2 카트리지 교체
gcode:
  _CREAM_SWAP TOOL=2

# 교체 대기 중 RESUME이면 장전 후 재개
[gcode_macro RESUME]
rename_existing: _CREAM_RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused and printer["gcode_macro _CREAM_STATE"].load_pending %}
    CREAM_LOAD
    SET_GCODE_VARIABLE MACRO=_CREAM_STATE VARIABLE=load_pending VALUE=False
  {% endif %}
  _CREAM_RESUME_BASE {rawparams}

# 교체 대기 중 취소하면 다음 수동 RESUME에서 장전하지 않게 초기화
[gcode_macro CANCEL_PRINT]
rename_existing: _CREAM_CANCEL_BASE
gcode:
  SET_GCODE_VARIABLE MACRO=_CREAM_STATE VARIABLE=load_pending VALUE=False
  _CREAM_CANCEL_BASE {rawparams}

[gcode_macro CREAM_LOAD]
description: 밀대를 load_mm 만큼 내려 플런저에 닿게 함
gcode:
  {% set cfg = printer["gcode_macro _CREAM_CFG"] %}
  _CREAM_CHECK_PISTON DIST={cfg.load_mm}
  SAVE_GCODE_STATE NAME=_cream_load
  M83
  M221 S100
  G1 E{cfg.load_mm} F{cfg.piston_speed * 60}
  RESTORE_GCODE_STATE NAME=_cream_load

[gcode_macro PRIME]
description: 판을 앞으로 빼고 컵에서 프라이밍. E=mm
gcode:
  {% set cfg = printer["gcode_macro _CREAM_CFG"] %}
  {% set e = params.E|default(cfg.prime_mm|default(none)) %}
  {% if e is none %}
    {action_raise_error("크림: 프라이밍 양 없음. PRIME E=mm 또는 _CREAM_CFG prime_mm")}
  {% endif %}
  {% set z_top = printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z %}
  {% set z_safe = [[printer.gcode_move.gcode_position.z + cfg.swap_lift, cfg.swap_z]|max, z_top]|min %}
  _CREAM_CHECK_HOMED
  SAVE_GCODE_STATE NAME=_cream_prime
  G90
  M83
  G1 Z{z_safe} F{cfg.travel_speed * 60}
  G1 X{cfg.prime_x} Y{cfg.prime_y} F{cfg.travel_speed * 60}
  G1 Z{cfg.prime_z} F{cfg.travel_speed * 60}
  G1 E{e|float} F{cfg.piston_speed * 60}
  G1 Z{z_safe} F{cfg.travel_speed * 60}
  RESTORE_GCODE_STATE NAME=_cream_prime

[gcode_macro CREAM_PISTON]
description: 밀대 이동. DIST=mm(아래 +), FORCE=1 이면 표시선 제한 무시
gcode:
  {% set cfg = printer["gcode_macro _CREAM_CFG"] %}
  {% if "DIST" not in params %}
    {action_raise_error("크림: DIST 필요. 예: CREAM_PISTON DIST=10")}
  {% endif %}
  {% set dist = params.DIST|float %}
  {% if params.FORCE|default(0)|int %}
    {% if dist|abs > cfg.piston_max %}
      {action_raise_error("크림: 행정 piston_max %.2f mm 초과" % cfg.piston_max)}
    {% endif %}
    # 위치 추적 밖에서 움직임. 표시선 맞춘 뒤 CREAM_PISTON_SET 필요. 가속은 1초에 속도 도달
    FORCE_MOVE STEPPER=extruder DISTANCE={dist} VELOCITY={cfg.piston_speed} ACCEL={cfg.piston_speed}
  {% else %}
    _CREAM_CHECK_PISTON DIST={dist}
    SAVE_GCODE_STATE NAME=_cream_piston
    M83
    M221 S100
    G1 E{dist} F{cfg.piston_speed * 60}
    RESTORE_GCODE_STATE NAME=_cream_piston
  {% endif %}

[gcode_macro CREAM_PISTON_SET]
description: 현재 밀대 위치를 표시선(0)으로 설정
gcode:
  SET_GCODE_VARIABLE MACRO=_CREAM_STATE VARIABLE=piston_zero VALUE={printer.toolhead.position.e}
  RESPOND MSG="크림: 밀대 표시선 0 설정"
